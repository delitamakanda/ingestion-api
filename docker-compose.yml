services:
  postgres:
    image: pgvector/pgvector:pg17

    environment:
      POSTGRES_DB: ingestion
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion -d ingestion"]

volumes:
  postgres-data:
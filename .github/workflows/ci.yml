name: CI
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

  test:
      name: Tests
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v6

        - name: Setup Python
          run: uv python install 3.14

        - name: Install dependencies
          run: uv sync --dev

        - name: Run Tests
          run: uv run pytest

name: CI
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

  test:
      name: Tests
      runs-on: ubuntu-latest

      env:
        DATABASE_URL: postgresql+asyncpg://ingestion:ingestion@localhost:5432/ingestion_test
        ALEMBIC_DATABASE_URL: postgresql+psycopg://ingestion:ingestion@localhost:5432/ingestion_test

        OPENAI_API_KEY: test-api-key
        RERANKER_MODEL: BAAI/bge-reranker-v2-m3
        REDIS_URL: redis://localhost:6379/0

      services:
        postgres:
          image: pgvector/pgvector:pg17
          env:
              POSTGRES_DB: ingestion_test
              POSTGRES_PASSWORD: ingestion
              POSTGRES_USER: ingestion
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U ingestion -d ingestion_test"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v6

        - name: Setup Python
          run: uv python install 3.14

        - name: Install dependencies
          run: uv sync --dev

        - name: Check PostgreSQL
          run: |
            pg_isready -h localhost -p 5432 -U ingestion -d ingestion_test

        - name: Run Alembic migrations
          run: uv run alembic upgrade head

        - name: Run Tests
          run: uv run pytest
